<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet" />
    <title>RightDrop Healthcare App Foundation</title>
    <meta property="og:image" content="https://bolt.new/static/og_default.png">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:image" content="https://bolt.new/static/og_default.png">
  </head>
  <body>
    <div id="root"></div>
    <script>
      // If the app cannot start (its script did not load, or stopped while loading),
      // say so instead of leaving a white page. Does nothing once the app is on screen.
      (function () {
        function showStartError(detail) {
          var root = document.getElementById('root')
          if (!root || root.childNodes.length > 0) return
          var box = document.createElement('div')
          box.setAttribute('role', 'alert')
          box.style.cssText = 'max-width:34rem;margin:15vh auto 0;padding:1.5rem;border:2px solid #f59e0b;border-radius:1.5rem;background:#fff;color:#0f172a;font-family:Tajawal,system-ui,sans-serif;line-height:1.8'
          var title = document.createElement('h1')
          title.style.cssText = 'margin:0 0 .5rem;font-size:1.5rem'
          title.textContent = 'تعذّر تشغيل التطبيق'
          var text = document.createElement('p')
          text.style.cssText = 'margin:0;font-size:1.125rem'
          text.textContent = 'حدّث الصفحة. إذا استمرت المشكلة فالموقع يحتاج مراجعة إعدادات النشر.'
          box.appendChild(title)
          box.appendChild(text)
          if (detail) {
            var info = document.createElement('p')
            info.dir = 'ltr'
            info.style.cssText = 'margin:.75rem 0 0;font-size:.875rem;color:#64748b;word-break:break-word'
            info.textContent = String(detail).slice(0, 300)
            box.appendChild(info)
          }
          root.appendChild(box)
        }
        window.addEventListener('error', function (event) {
          var target = event && event.target
          // a picture or a font that fails to load is not a reason to stop
          if (target && target !== window && target.tagName !== 'SCRIPT') return
          showStartError(event && event.message ? event.message : 'The application script could not be loaded.')
        }, true)
        window.addEventListener('load', function () {
          setTimeout(function () { showStartError('') }, 5000)
        })
      })()
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
